name: image-scan

# Supply-chain gate for the verifier/grader images. Runs on demand and when the
# image build context changes. Fails on any Critical/High CVE and writes SBOMs
# as release evidence. Kept separate from the offline `ci.yml` quality gate
# because it needs Docker and image builds.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "eval/verifier/**"
  push:
    paths:
      - "eval/verifier/**"

permissions:
  contents: read

concurrency:
  group: image-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Install Trivy (version-pinned)
        run: |
          VERSION=v0.55.0
          curl -sfL "https://raw.githubusercontent.com/aquasecurity/trivy/${VERSION}/contrib/install.sh" \
            | sh -s -- -b /usr/local/bin "${VERSION}"
          trivy --version
      - name: Build, scan (fail on Critical/High), and write SBOMs
        run: bash eval/verifier/scan_images.sh
      - name: List SBOM evidence
        if: always()
        run: ls -la eval/verifier/sbom || true
